name: vatly-fluentcart

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.wp
    depends_on:
      db:
        condition: service_healthy
      mock-vatly:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', '/tmp/wp-debug.log');
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      # Bind-mount the plugin source so edits hot-reload without a rebuild.
      - ..:/var/www/html/wp-content/plugins/vatly-for-fluentcart
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  wp-cli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/vatly-for-fluentcart
      - ./setup.sh:/usr/local/bin/setup-vatly-fluentcart.sh:ro
    # Clear entrypoint so `docker compose run --rm wp-cli setup-vatly-fluentcart.sh`
    # resolves the script through PATH (it's mounted at /usr/local/bin/...),
    # rather than passing it as an arg to `/bin/sh` in cwd /var/www/html.
    # The wp-cli image's default CMD (`wp`) is preserved for shell sessions.
    entrypoint: []
    # Keep the container warm so other commands can `exec` into it.
    command: ["tail", "-f", "/dev/null"]

  # Lightweight mock of the Vatly API — just enough to drive the plugin through
  # checkout, return, and webhook delivery locally. Speaks v1 of the API (the
  # version vatly/vatly-api-php targets).
  mock-vatly:
    build:
      context: ./mock-vatly
    environment:
      # The mock POSTs webhooks to this URL after the hosted-checkout "pay"
      # button. Defaults to admin-ajax inside the docker network.
      VATLY_WEBHOOK_URL: "http://wordpress/wp-admin/admin-ajax.php?action=fluent_cart_vatly_webhook"
    ports:
      - "8081:8080"

volumes:
  db_data:
  wp_data:
